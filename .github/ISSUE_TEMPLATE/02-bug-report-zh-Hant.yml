name: "繁體中文 · BUG回報"
description: "回報 ECHOAndroid 的異常行為或錯誤。"
title: "[BUG] "
body:
  - type: "markdown"
    attributes:
      value: |
        **提問請講文明、懂禮貌。**

        **世界上沒有人欠你的。** 回答你的人是在用自己的時間幫你，請把這份幫助當作情分，而不是義務。
  - type: "checkboxes"
    id: "confirmation"
    attributes:
      label: "提交前確認"
      options:
        - label: "我的素質達標且我確認這是需求"
          required: true
  - type: "input"
    id: "app-version"
    attributes:
      label: "ECHOAndroid 版本"
      placeholder: "請填寫完整版本號"
    validations:
      required: true
  - type: "input"
    id: "device"
    attributes:
      label: "裝置型號與 Android 版本"
      placeholder: "例如：Pixel 9 / Android 16"
    validations:
      required: true
  - type: "textarea"
    id: "actual"
    attributes:
      label: "問題描述"
      description: "實際發生了什麼？"
    validations:
      required: true
  - type: "textarea"
    id: "steps"
    attributes:
      label: "重現步驟"
      description: "請依序描述操作；無法穩定重現時，請說明發生條件與頻率。"
    validations:
      required: true
  - type: "textarea"
    id: "expected"
    attributes:
      label: "預期行為"
      description: "你期望正常情況下發生什麼？"
    validations:
      required: true
  - type: "textarea"
    id: "attachments"
    attributes:
      label: "日誌、截圖與補充資訊"
      description: "可附上相關日誌或截圖，請先移除帳號、權杖等隱私資訊。"
