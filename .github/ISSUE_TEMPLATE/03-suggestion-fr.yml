name: "Français · Suggestion"
description: "Proposez des améliorations de l’expérience, de l’interface ou de la documentation."
title: "[Suggestion] "
body:
  - type: "markdown"
    attributes:
      value: |
        **Posez vos questions avec respect et politesse.**

        **Personne ne vous doit quoi que ce soit.** Les personnes qui répondent prennent sur leur temps pour vous aider. Considérez cette aide comme une marque de bienveillance, pas comme une obligation.
  - type: "checkboxes"
    id: "confirmation"
    attributes:
      label: "Avant l’envoi"
      options:
        - label: "Je confirme pouvoir me comporter avec respect et qu’il s’agit d’une demande légitime."
          required: true
  - type: "textarea"
    id: "current"
    attributes:
      label: "Expérience actuelle"
      description: "Décrivez la page, l’action ou la documentation concernée et les points à améliorer."
    validations:
      required: true
  - type: "textarea"
    id: "suggestion"
    attributes:
      label: "Amélioration proposée"
      description: "Que changeriez-vous et quel bénéfice en attendez-vous ?"
    validations:
      required: true
  - type: "textarea"
    id: "references"
    attributes:
      label: "Informations complémentaires"
      description: "Vous pouvez joindre des exemples ou des captures d’écran."
