name: "Русский · Сообщение об ошибке"
description: "Сообщите об ошибках или неожиданном поведении ECHOAndroid."
title: "[BUG] "
body:
  - type: "markdown"
    attributes:
      value: |
        **Задавайте вопросы вежливо и уважительно.**

        **Никто вам ничего не должен.** Люди, которые отвечают, тратят своё время, чтобы помочь вам. Воспринимайте эту помощь как добрую волю, а не как обязанность.
  - type: "checkboxes"
    id: "confirmation"
    attributes:
      label: "Перед отправкой"
      options:
        - label: "Я подтверждаю, что умею вести себя уважительно и что это обоснованный запрос."
          required: true
  - type: "input"
    id: "app-version"
    attributes:
      label: "Версия ECHOAndroid"
      placeholder: "Укажите полный номер версии"
    validations:
      required: true
  - type: "input"
    id: "device"
    attributes:
      label: "Модель устройства и версия Android"
      placeholder: "Например: Pixel 9 / Android 16"
    validations:
      required: true
  - type: "textarea"
    id: "actual"
    attributes:
      label: "Описание проблемы"
      description: "Что произошло на самом деле?"
    validations:
      required: true
  - type: "textarea"
    id: "steps"
    attributes:
      label: "Шаги воспроизведения"
      description: "Опишите действия по порядку. Если ошибка возникает не всегда, укажите условия и частоту."
    validations:
      required: true
  - type: "textarea"
    id: "expected"
    attributes:
      label: "Ожидаемое поведение"
      description: "Что должно было произойти?"
    validations:
      required: true
  - type: "textarea"
    id: "attachments"
    attributes:
      label: "Журналы, снимки экрана и дополнительная информация"
      description: "Приложите нужные журналы или снимки экрана. Сначала удалите личные данные, например сведения об аккаунтах и токены."
