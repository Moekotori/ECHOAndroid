name: "한국어 · 버그 제보"
description: "ECHOAndroid의 비정상적인 동작이나 오류를 제보합니다."
title: "[BUG] "
body:
  - type: "markdown"
    attributes:
      value: |
        **질문할 때는 예의 바르고 정중하게 말해 주세요.**

        **누구도 당신을 도와야 할 의무는 없습니다.** 답변하는 사람은 자신의 시간을 들여 당신을 돕고 있습니다. 그 도움을 의무가 아닌 호의로 받아들여 주세요.
  - type: "checkboxes"
    id: "confirmation"
    attributes:
      label: "제출 전 확인"
      options:
        - label: "예의를 지킬 수 있으며 이것이 정당한 요청임을 확인합니다."
          required: true
  - type: "input"
    id: "app-version"
    attributes:
      label: "ECHOAndroid 버전"
      placeholder: "전체 버전 번호를 입력해 주세요"
    validations:
      required: true
  - type: "input"
    id: "device"
    attributes:
      label: "기기 모델 및 Android 버전"
      placeholder: "예: Pixel 9 / Android 16"
    validations:
      required: true
  - type: "textarea"
    id: "actual"
    attributes:
      label: "문제 설명"
      description: "실제로 어떤 일이 발생했나요?"
    validations:
      required: true
  - type: "textarea"
    id: "steps"
    attributes:
      label: "재현 단계"
      description: "작업을 순서대로 설명해 주세요. 항상 재현되지 않는다면 발생 조건과 빈도를 적어 주세요."
    validations:
      required: true
  - type: "textarea"
    id: "expected"
    attributes:
      label: "기대 동작"
      description: "정상적으로는 어떻게 동작해야 하나요?"
    validations:
      required: true
  - type: "textarea"
    id: "attachments"
    attributes:
      label: "로그, 스크린샷 및 추가 정보"
      description: "관련 로그나 스크린샷을 첨부할 수 있습니다. 계정, 토큰 등의 개인정보는 먼저 삭제해 주세요."
