name: 简体中文 · 功能需求
description: 提出希望 ECHOAndroid 支持的新功能。
title: "[功能需求] "
body:
  - type: markdown
    attributes:
      value: |
        **提问请讲文明、懂礼貌。**

        **世界上没有人欠你的。**回答你的人是在用自己的时间帮你，请把这份帮助当作情分，而不是义务。
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交前确认
      options:
        - label: 我的素质达标且我确认这是需求
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 你在什么场景下遇到了什么需求？
    validations:
      required: true
  - type: textarea
    id: feature
    attributes:
      label: 期望的功能
      description: 请描述希望增加的功能及其预期行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与补充信息
      description: 可填写目前的解决方式、参考案例或截图。
