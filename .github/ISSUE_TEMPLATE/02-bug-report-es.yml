name: "Español · Informe de error"
description: "Informa de errores o comportamientos inesperados en ECHOAndroid."
title: "[BUG] "
body:
  - type: "markdown"
    attributes:
      value: |
        **Haz tus preguntas con respeto y educación.**

        **Nadie te debe nada.** Quienes responden dedican su propio tiempo a ayudarte. Considera esa ayuda un gesto de buena voluntad, no una obligación.
  - type: "checkboxes"
    id: "confirmation"
    attributes:
      label: "Antes de enviar"
      options:
        - label: "Confirmo que puedo comportarme con respeto y que esta es una petición legítima."
          required: true
  - type: "input"
    id: "app-version"
    attributes:
      label: "Versión de ECHOAndroid"
      placeholder: "Introduce el número de versión completo"
    validations:
      required: true
  - type: "input"
    id: "device"
    attributes:
      label: "Modelo del dispositivo y versión de Android"
      placeholder: "Por ejemplo: Pixel 9 / Android 16"
    validations:
      required: true
  - type: "textarea"
    id: "actual"
    attributes:
      label: "Descripción del problema"
      description: "¿Qué ocurrió realmente?"
    validations:
      required: true
  - type: "textarea"
    id: "steps"
    attributes:
      label: "Pasos para reproducirlo"
      description: "Describe los pasos en orden. Si no ocurre siempre, indica en qué condiciones y con qué frecuencia sucede."
    validations:
      required: true
  - type: "textarea"
    id: "expected"
    attributes:
      label: "Comportamiento esperado"
      description: "¿Qué esperabas que ocurriera?"
    validations:
      required: true
  - type: "textarea"
    id: "attachments"
    attributes:
      label: "Registros, capturas e información adicional"
      description: "Adjunta registros o capturas relevantes. Elimina primero los datos privados, como cuentas y tokens."
