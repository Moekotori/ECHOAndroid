name: "Русский · Предложение"
description: "Предложите улучшения удобства использования, интерфейса или документации."
title: "[Предложение] "
body:
  - type: "markdown"
    attributes:
      value: |
        **Задавайте вопросы вежливо и уважительно.**

        **Никто вам ничего не должен.** Люди, которые отвечают, тратят своё время, чтобы помочь вам. Воспринимайте эту помощь как добрую волю, а не как обязанность.
  - type: "checkboxes"
    id: "confirmation"
    attributes:
      label: "Перед отправкой"
      options:
        - label: "Я подтверждаю, что умею вести себя уважительно и что это обоснованный запрос."
          required: true
  - type: "textarea"
    id: "current"
    attributes:
      label: "Текущий опыт использования"
      description: "Опишите страницу, действие или документацию и то, что можно улучшить."
    validations:
      required: true
  - type: "textarea"
    id: "suggestion"
    attributes:
      label: "Предлагаемое улучшение"
      description: "Что вы предлагаете изменить и какую пользу это принесёт?"
    validations:
      required: true
  - type: "textarea"
    id: "references"
    attributes:
      label: "Дополнительная информация"
      description: "Можно приложить примеры или снимки экрана."
