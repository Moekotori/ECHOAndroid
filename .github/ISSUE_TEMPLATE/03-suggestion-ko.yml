name: "한국어 · 개선 제안"
description: "기존 사용 경험, 화면 또는 문서의 개선을 제안합니다."
title: "[개선 제안] "
body:
  - type: "markdown"
    attributes:
      value: |
        **질문할 때는 예의 바르고 정중하게 말해 주세요.**

        **누구도 당신을 도와야 할 의무는 없습니다.** 답변하는 사람은 자신의 시간을 들여 당신을 돕고 있습니다. 그 도움을 의무가 아닌 호의로 받아들여 주세요.
  - type: "checkboxes"
    id: "confirmation"
    attributes:
      label: "제출 전 확인"
      options:
        - label: "예의를 지킬 수 있으며 이것이 정당한 요청임을 확인합니다."
          required: true
  - type: "textarea"
    id: "current"
    attributes:
      label: "현재 사용 경험"
      description: "관련 화면, 작업 또는 문서와 개선할 점을 설명해 주세요."
    validations:
      required: true
  - type: "textarea"
    id: "suggestion"
    attributes:
      label: "개선 제안 내용"
      description: "어떻게 변경하면 어떤 점이 좋아질까요?"
    validations:
      required: true
  - type: "textarea"
    id: "references"
    attributes:
      label: "추가 정보"
      description: "참고 사례나 스크린샷을 첨부할 수 있습니다."
