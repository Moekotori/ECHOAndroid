name: "Deutsch · Funktionswunsch"
description: "Schlage eine neue Funktion für ECHOAndroid vor."
title: "[Funktionswunsch] "
body:
  - type: "markdown"
    attributes:
      value: |
        **Stelle deine Fragen respektvoll und höflich.**

        **Niemand schuldet dir etwas.** Wer dir antwortet, nimmt sich dafür eigene Zeit. Betrachte diese Hilfe als Entgegenkommen und nicht als Pflicht.
  - type: "checkboxes"
    id: "confirmation"
    attributes:
      label: "Vor dem Absenden"
      options:
        - label: "Ich bestätige, dass ich respektvoll auftreten kann und dass dies eine ernst gemeinte Anfrage ist."
          required: true
  - type: "textarea"
    id: "problem"
    attributes:
      label: "Anwendungsfall"
      description: "In welcher Situation brauchst du diese Funktion und welches Problem würde sie lösen?"
    validations:
      required: true
  - type: "textarea"
    id: "feature"
    attributes:
      label: "Gewünschte Funktion"
      description: "Beschreibe die gewünschte Funktion und ihr erwartetes Verhalten."
    validations:
      required: true
  - type: "textarea"
    id: "alternatives"
    attributes:
      label: "Alternativen und weitere Informationen"
      description: "Nenne bisherige Lösungen, Beispiele oder Screenshots."
